name: CI

# The project's own contract is the typechecker and the test suite, so those
# are what runs here. A push that breaks either never reaches the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run in flight: the queue of
# commits is not interesting, only the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # better-sqlite3 ships a prebuilt binary tied to the Node ABI, so the
      # Node version is pinned rather than left to the runner's default.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run sv-check
      - run: npm run build
      - run: npm run check-limits
