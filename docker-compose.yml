# LabelBench — one-command bring-up on an amd64 Ubuntu/Debian host.
#
#   docker compose up -d --build
#
# Serves https://labelbench.local (see .env for LABELBENCH_HOST).
# The SQLite file and the asset directory under ./data are the entire backup.

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: labelbench/app:1.0.0
    restart: unless-stopped
    environment:
      LABELBENCH_HOST: 0.0.0.0
      LABELBENCH_PORT: 3000
      LABELBENCH_DATA_DIR: /data
      LABELBENCH_DB_PATH: /data/labelbench.db
      LABELBENCH_ASSET_DIR: /data/assets
      LABELBENCH_STATIC_DIR: /app/public
      # Phase 1 runs open on the trusted LAN. The seam for a later gate:
      # LABELBENCH_AUTH_MODE: apikey
      # LABELBENCH_API_KEY: <shared secret>
      LABELBENCH_AUTH_MODE: ${LABELBENCH_AUTH_MODE:-none}
      LABELBENCH_API_KEY: ${LABELBENCH_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - labelbench-data:/data
    expose:
      - "3000"
    networks:
      - labelbench

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      LABELBENCH_HOST: ${LABELBENCH_HOST:-labelbench.local}
      LABELBENCH_IP: ${LABELBENCH_IP:-10.10.17.185}
      LABELBENCH_HTTPS_PORT: ${LABELBENCH_HTTPS_PORT:-8443}
      LABELBENCH_HTTP_PORT: ${LABELBENCH_HTTP_PORT:-8082}
    ports:
      # These are the ports the workstations open. They must be a
      # browser-trusted HTTPS origin, or Web Bluetooth / Web Serial are
      # unavailable and printing cannot work at all.
      #
      # 80 and 443 are deliberately NOT used. This host runs several apps,
      # and the standard web ports belong to whichever app is the front door.
      # LabelBench takes a dedicated pair so another app can have 80 and 443
      # without a fight. Change them in .env:
      #
      #   LABELBENCH_HTTPS_PORT=8443
      #   LABELBENCH_HTTP_PORT=8082
      - "${LABELBENCH_HTTPS_PORT:-8443}:443"
      - "${LABELBENCH_HTTP_PORT:-8082}:80"
    # --watch makes Caddy reload itself when the Caddyfile changes.
    #
    # The whole deploy/caddy DIRECTORY is mounted, not the Caddyfile on its
    # own. A bind mount of a single file pins the inode the container sees:
    # an editor that replaces the file (write to a temp file, then rename)
    # gives it a new inode, and the container keeps serving the old one
    # until it is recreated. Mounting the directory means the container
    # re-reads the directory entry and sees the replacement immediately.
    command: ["caddy", "run", "--config", "/etc/caddy/lab/Caddyfile", "--adapter", "caddyfile", "--watch"]
    volumes:
      - ./deploy/caddy:/etc/caddy/lab:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - labelbench

volumes:
  labelbench-data:
  caddy-data:
  caddy-config:

networks:
  labelbench:
